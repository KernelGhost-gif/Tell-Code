<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">Tell — a sentence-first programming language</title>
  <desc id="desc">A dark indigo and teal banner with the Tell wordmark and a short Tell code example.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101329"/>
      <stop offset=".52" stop-color="#1d2148"/>
      <stop offset="1" stop-color="#102337"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8effd9"/>
      <stop offset="1" stop-color="#65b9ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#766cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#766cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#aab8ff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1600" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="470" rx="28" fill="url(#grid)"/>
  <ellipse cx="230" cy="85" rx="460" ry="330" fill="url(#halo)"/>
  <ellipse cx="1390" cy="415" rx="460" ry="280" fill="url(#halo)"/>
