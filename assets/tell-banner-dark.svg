<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Tell Code</title>
  <desc id="desc">A dark, minimal Tell Code banner with a code symbol, compact project badges, a TellC code window and a GitHub star link.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#111b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65b5ff"/>
      <stop offset="1" stop-color="#2875e8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182333"/>
      <stop offset="1" stop-color="#0e1724"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="780" rx="30" fill="url(#background)"/>
  <path d="M0 0h410c-86 110-194 161-410 179z" fill="#142b48" opacity=".42"/>
  <path d="M1600 590c-153 20-263 82-356 190h356z" fill="#142b48" opacity=".5"/>
  <path d="M0 656c202-70 310-74 482-33" fill="none" stroke="#2a6dbb" stroke-opacity=".18" stroke-width="2"/>
  <path d="M1130 50c120 25 224 16 350-26" fill="none" stroke="#2a6dbb" stroke-opacity=".14" stroke-width="2"/>

  <!-- Brand -->
  <g transform="translate(92 194)">
    <rect width="174" height="174" rx="35" fill="#101c2c" stroke="url(#accent)" stroke-width="5"/>
    <path d="M67 58 34 87l33 29M107 58l33 29-33 29M98 45 76 129" fill="none" stroke="#e8f2ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M310 190v184" stroke="#32445a" stroke-width="2"/>
  <text x="362" y="302" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="105" font-weight="750" letter-spacing="-5">Tell <tspan fill="#4b9af4">Code</tspan></text>

  <!-- Compact badges -->
  <g transform="translate(365 348)" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650">
    <rect width="158" height="54" rx="27" fill="#111d2b" stroke="#34485f" stroke-width="2"/>
    <text x="79" y="36" text-anchor="middle" fill="#dce8f6">MIT</text>
    <rect x="178" width="190" height="54" rx="27" fill="#111d2b" stroke="#34485f" stroke-width="2"/>
    <text x="273" y="36" text-anchor="middle" fill="#dce8f6">v0.3.8</text>
    <rect x="388" width="162" height="54" rx="27" fill="#111d2b" stroke="#34485f" stroke-width="2"/>
    <text x="469" y="36" text-anchor="middle" fill="#dce8f6">LLVM</text>
  </g>

  <!-- Small feature marks -->
  <g transform="translate(385 477)" fill="none" stroke="#5aa7f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m23 0-23 39h23l-8 38 34-49H26l8-28z"/>
    <path d="M151 12 178 0l27 12-27 13zM151 30l27 13 27-13M151 48l27 13 27-13"/>
    <path d="m300 11-27 23 27 23M350 11l27 23-27 23M337 2l-24 64"/>
    <path d="M471 12h19a13 13 0 1 1 13 13v18a13 13 0 1 1-13 13h-19a13 13 0 1 1-13-13V25a13 13 0 1 1 13-13z"/>
  </g>
  <path d="M528 476v82M730 476v82M934 476v82" stroke="#31445c" stroke-width="2"/>

  <!-- Code window -->
  <rect x="1000" y="169" width="500" height="390" rx="24" fill="#000" opacity=".4" filter="url(#shadow)"/>
  <g transform="translate(965 130)">
    <rect width="540" height="440" rx="25" fill="url(#window)" stroke="#344c68" stroke-width="3"/>
    <path d="M0 72h540" stroke="#2e4057" stroke-width="2"/>
    <circle cx="34" cy="36" r="9" fill="#e46e72"/>
    <circle cx="65" cy="36" r="9" fill="#d8ad55"/>
    <circle cx="96" cy="36" r="9" fill="#5bb58a"/>
    <text x="142" y="44" fill="#d6e2f1" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600">hello.tc</text>

    <g font-family="SFMono-Regular,Consolas,monospace" font-size="23">
      <text x="38" y="126" fill="#7589a4">1</text>
      <text x="85" y="126" fill="#ce80f2">import</text>
      <text x="176" y="126" fill="#e5edf7">std.io</text>
      <text x="38" y="178" fill="#7589a4">2</text>
      <text x="38" y="230" fill="#7589a4">3</text>
      <text x="85" y="230" fill="#56c9e8">fn main</text>
      <text x="209" y="230" fill="#e5edf7">() {</text>
      <text x="38" y="282" fill="#7589a4">4</text>
      <text x="124" y="282" fill="#8acb78">print</text>
      <text x="188" y="282" fill="#e5edf7">(</text>
      <text x="202" y="282" fill="#e7c36b">"Hello from TellC!"</text>
      <text x="432" y="282" fill="#e5edf7">);</text>
      <text x="38" y="334" fill="#7589a4">5</text>
      <text x="85" y="334" fill="#e5edf7">}</text>
    </g>
    <rect x="25" y="365" width="490" height="54" rx="12" fill="#09121d" stroke="#26394f"/>
    <text x="48" y="399" fill="#65b5ff" font-family="SFMono-Regular,Consolas,monospace" font-size="20">$ tellc run hello.tc</text>
  </g>

  <!-- GitHub link -->
  <g transform="translate(575 651)">
    <rect width="450" height="82" rx="41" fill="#101c2a" stroke="#3f8fe8" stroke-width="3"/>
    <path d="M47 28a16 16 0 1 0 32 0 16 16 0 0 0-32 0zm8 31c-1-8 1-12 7-14 6-2 9 2 12 2 3-1 4-3 7-3" fill="none" stroke="#e9f3ff" stroke-width="4" stroke-linecap="round"/>
    <text x="118" y="53" fill="#edf4fc" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650">Star on GitHub</text>
  </g>
</svg>