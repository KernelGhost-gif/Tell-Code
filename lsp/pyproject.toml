[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tellc-language-server"
version = "0.1.0"
description = "Language server for the typed TellC language"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
tell-lsp = "tell_lsp.__main__:main"

[tool.setuptools]
packages = ["tell_lsp"]
