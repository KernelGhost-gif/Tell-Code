name: Luna package integration

on:
  push:
    branches: [main]
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/luna-integration.yml"
  pull_request:
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/luna-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curated-linux-packages:
    name: Build and exercise curated Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Tell
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev autoconf automake libtool bison flex pkg-config

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Luna and its CLI dependencies
        run: |
          python -m pip install --user git+https://github.com/Neonwave175/Luna.git
          python -m pip install --user rich
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/luna" >> "$GITHUB_PATH"
          luna --help

      - name: Build the Tell CLI
        working-directory: native
        run: go build -trimpath -o "$RUNNER_TEMP/tell" ./cmd/tell

      - name: Search and inspect the embedded catalogue
        run: |
          "$RUNNER_TEMP/tell" pkg search | tee "$RUNNER_TEMP/catalogue.txt"
          grep -q tokei "$RUNNER_TEMP/catalogue.txt"
          grep -q google-java-format "$RUNNER_TEMP/catalogue.txt"
          "$RUNNER_TEMP/tell" pkg info rg
          "$RUNNER_TEMP/tell" pkg info staticcheck

      - name: Register, build, and install the validated starter packages
        run: |
          "$RUNNER_TEMP/tell" pkg install tokei rg fd bat hyperfine
          "$RUNNER_TEMP/tell" pkg install btop cmatrix jq fastfetch
          "$RUNNER_TEMP/tell" pkg install shfmt gofumpt staticcheck
          "$RUNNER_TEMP/tell" pkg install ruff black stylua dprint
          for binary in tokei rg fd bat hyperfine btop cmatrix jq fastfetch shfmt gofumpt staticcheck ruff black stylua dprint; do
            test -x "$HOME/.local/luna/$binary"
            "$HOME/.local/luna/$binary" --version
          done

      - name: Exercise Luna listing
        run: |
          "$RUNNER_TEMP/tell" pkg list | tee "$RUNNER_TEMP/luna-list.txt"
          for package in tokei rg fd bat hyperfine btop cmatrix jq fastfetch shfmt gofumpt staticcheck ruff black stylua dprint; do
            grep -q "$package" "$RUNNER_TEMP/luna-list.txt"
          done

      - name: Remove packages through Tell
        run: |
          for package in tokei rg fd bat hyperfine btop cmatrix jq fastfetch shfmt gofumpt staticcheck ruff black stylua dprint; do
            "$RUNNER_TEMP/tell" pkg remove "$package"
            test ! -e "$HOME/.local/luna/$package"
            test ! -d "$HOME/.local/lunasource/$package"
          done

      - name: Show the remaining recipe-only language entries
        run: |
          for package in google-java-format php-cs-fixer rubocop hlint shellcheck dart-format swift-format prettier neovim sqlfluff; do
            "$RUNNER_TEMP/tell" pkg info "$package"
          done
