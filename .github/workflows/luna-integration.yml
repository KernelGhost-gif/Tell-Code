name: Luna package integration

on:
  push:
    branches: [main]
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/luna-integration.yml"
  pull_request:
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/luna-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-real-packages:
    name: Install and execute curated packages through Tell
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Tell
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Python and Luna prerequisites
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Luna and its CLI dependencies
        run: |
          python -m pip install --user git+https://github.com/Neonwave175/Luna.git
          python -m pip install --user rich
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          luna --help

      - name: Build the Tell CLI
        working-directory: native
        run: go build -trimpath -o "$RUNNER_TEMP/tell" ./cmd/tell

      - name: Search and inspect the embedded catalogue
        run: |
          "$RUNNER_TEMP/tell" pkg search | tee "$RUNNER_TEMP/catalogue.txt"
          grep -q tokei "$RUNNER_TEMP/catalogue.txt"
          "$RUNNER_TEMP/tell" pkg info rg

      - name: Register, build, and install all starter packages
        run: |
          "$RUNNER_TEMP/tell" pkg install tokei rg fd bat hyperfine
          for binary in tokei rg fd bat hyperfine; do
            test -x "$HOME/.local/luna/$binary"
            "$HOME/.local/luna/$binary" --version
          done

      - name: Exercise Luna listing
        run: |
          "$RUNNER_TEMP/tell" pkg list | tee "$RUNNER_TEMP/luna-list.txt"
          for package in tokei rg fd bat hyperfine; do
            grep -q "$package" "$RUNNER_TEMP/luna-list.txt"
          done

      - name: Remove packages through Tell
        run: |
          for package in tokei rg fd bat hyperfine; do
            "$RUNNER_TEMP/tell" pkg remove "$package"
            test ! -e "$HOME/.local/luna/$package"
            test ! -d "$HOME/.local/lunasource/$package"
          done
