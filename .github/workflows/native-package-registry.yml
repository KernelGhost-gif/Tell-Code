name: Native package registry integration

on:
  push:
    branches: [main]
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/native-package-registry.yml"
  pull_request:
    paths:
      - "native/cmd/tell/**"
      - ".github/workflows/native-package-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-update-remove:
    name: Install, update, and remove packages through native registries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Tell
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Tell
        working-directory: native
        run: go build -trimpath -o "$RUNNER_TEMP/tell" ./cmd/tell

      - name: Install from four language registries
        run: |
          "$RUNNER_TEMP/tell" pkg install cargo:typos-cli npm:prettier pip:ruff go:golang.org/x/tools/gopls
          echo "$HOME/.local/tell/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/tell/bin/typos"
          test -x "$HOME/.local/tell/bin/prettier"
          test -x "$HOME/.local/tell/bin/ruff"
          test -x "$HOME/.local/tell/bin/gopls"
          "$HOME/.local/tell/bin/typos" --version
          "$HOME/.local/tell/bin/prettier" --version
          "$HOME/.local/tell/bin/ruff" --version
          "$HOME/.local/tell/bin/gopls" version

      - name: Verify native package state
        run: |
          "$RUNNER_TEMP/tell" pkg list | tee "$RUNNER_TEMP/native-packages.txt"
          grep -q 'cargo:typos-cli' "$RUNNER_TEMP/native-packages.txt"
          grep -q 'npm:prettier' "$RUNNER_TEMP/native-packages.txt"
          grep -q 'pip:ruff' "$RUNNER_TEMP/native-packages.txt"
          grep -q 'go:golang.org/x/tools/gopls' "$RUNNER_TEMP/native-packages.txt"

      - name: Update tracked native packages
        run: |
          "$RUNNER_TEMP/tell" pkg update
          "$HOME/.local/tell/bin/typos" --version
          "$HOME/.local/tell/bin/prettier" --version
          "$HOME/.local/tell/bin/ruff" --version
          "$HOME/.local/tell/bin/gopls" version

      - name: Remove through Tell and verify cleanup
        run: |
          "$RUNNER_TEMP/tell" pkg remove cargo:typos-cli
          "$RUNNER_TEMP/tell" pkg remove npm:prettier
          "$RUNNER_TEMP/tell" pkg remove pip:ruff
          "$RUNNER_TEMP/tell" pkg remove go:golang.org/x/tools/gopls
          test ! -e "$HOME/.local/tell/bin/typos"
          test ! -e "$HOME/.local/tell/bin/prettier"
          test ! -e "$HOME/.local/tell/bin/ruff"
          test ! -e "$HOME/.local/tell/bin/gopls"
          "$RUNNER_TEMP/tell" pkg list
