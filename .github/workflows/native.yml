name: Native runtime

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tell-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Python runtime tests
        run: |
          python -m compileall -q tell tests scripts
          python -m unittest discover -s tests -v
      - name: Run native tests, race detector, and vet
        working-directory: native
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build Linux, macOS and Windows binaries
        run: ./scripts/build-all.sh
      - name: Verify process-level runtime conformance
        run: |
          python scripts/conformance.py --runtime both --fixtures conformance/smoke-v1.json --native-bin releases/tell-linux-amd64
          python scripts/conformance.py --runtime both --fixtures conformance/runtime-v1.json --native-bin releases/tell-linux-amd64
      - name: Run Tell source examples as tests
        run: ./releases/tell-linux-amd64 test examples
      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: tell-native-binaries
          path: releases/
          if-no-files-found: error
