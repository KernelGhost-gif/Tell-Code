name: Build README topic loops

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate-readme-topic-clips.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-topic-loops
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade Pillow numpy
      - name: Render five-second topic loops and update README
        run: python scripts/generate-readme-topic-clips.py --out assets/tell-clips --readme README.md --update-readme
      - name: Commit generated videos and README embeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tell-clips
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add looping topic clips to README"
            git push
          fi
