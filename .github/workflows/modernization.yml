name: Runtime modernization CI

on:
  push:
    branches:
      - "modernization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Go tests and vet
        working-directory: native
        run: |
          go test ./...
          go vet ./...
      - name: Run Python tests
        run: |
          python -m compileall -q tell tests scripts
          python -m unittest discover -s tests -v
      - name: Build native runner and run portable cross-runtime smoke tests
        run: |
          mkdir -p dist
          cd native
          go build -trimpath -o ../dist/tell-linux-amd64 ./cmd/tell
          cd ..
          python scripts/conformance.py --runtime both --fixtures conformance/smoke-v1.json --native-bin dist/tell-linux-amd64
      - name: Upload native test binary
        uses: actions/upload-artifact@v4
        with:
          name: tell-linux-validation
          path: dist/tell-linux-amd64
          if-no-files-found: error
