name: TellC LLVM compiler

on:
  push:
    branches: [main]
    paths:
      - "TellC/**"
      - "lsp/**"
      - ".github/workflows/tellc.yml"
      - "scripts/build-tellc-windows.ps1"
  pull_request:
    paths:
      - "TellC/**"
      - "lsp/**"
      - ".github/workflows/tellc.yml"
      - "scripts/build-tellc-windows.ps1"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tellc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-llvm:
    name: Linux / external LLVM toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 and Clang
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 valgrind
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Configure TellC
        run: |
          cmake -S TellC -B build/tellc \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DTELL_LLC_PATH=/usr/lib/llvm-21/bin/llc

      - name: Build TellC
        run: cmake --build build/tellc --parallel 2

      - name: Run compiler and language server tests
        run: ctest --test-dir build/tellc --output-on-failure

  macos-arm64-external:
    name: Apple silicon / external LLVM toolchain (PR validation)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Ninja
        run: brew install llvm ninja

      - name: Configure TellC with external LLVM on Apple silicon
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S TellC -B build/tellc-arm64-external -G Ninja \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DTELL_LLC_PATH="$LLVM_PREFIX/bin/llc" \
            -DTELL_STANDALONE_MACOS=OFF
          grep -q '^TELL_STANDALONE_MACOS:BOOL=OFF$' build/tellc-arm64-external/CMakeCache.txt

      - name: Build and test the Apple silicon compiler
        run: |
          cmake --build build/tellc-arm64-external --parallel 2
          ctest --test-dir build/tellc-arm64-external --output-on-failure

  macos-standalone:
    if: github.event_name != 'pull_request'
    name: Apple silicon / embedded LLVM + LLD
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the LLVM 24 source revision
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: 5966b6af610f1e7b2628e15e013b0618404aa54c
          path: llvm-project
          fetch-depth: 1

      - name: Build the standalone compiler and run all tests
        env:
          LLVM_SOURCE: ${{ github.workspace }}/llvm-project
          JOBS: "2"
        run: ./scripts/build-tellc-macos.sh

      - name: Upload Apple silicon compiler
        uses: actions/upload-artifact@v4
        with:
          name: tellc-macos-arm64
          path: build/tellc-macos-arm64/tellc/tellc
          if-no-files-found: error

  macos-intel:
    name: Intel macOS / external LLVM toolchain
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Ninja
        run: brew install llvm ninja

      - name: Configure TellC using the external toolchain
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S TellC -B build/tellc-intel -G Ninja \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DTELL_LLC_PATH="$LLVM_PREFIX/bin/llc"
          grep -q '^TELL_STANDALONE_MACOS:BOOL=OFF$' build/tellc-intel/CMakeCache.txt

      - name: Build and test the Intel-compatible configuration
        run: |
          cmake --build build/tellc-intel --parallel 2
          ctest --test-dir build/tellc-intel --output-on-failure

  windows-x64:
    name: Windows x64 / external LLVM toolchain
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Initialize the MSVC x64 build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download the complete LLVM development archive
        shell: pwsh
        run: |
          choco install aria2 --no-progress --yes
          $aria2 = Join-Path $env:ChocolateyInstall "bin\aria2c.exe"
          if (-not (Test-Path $aria2 -PathType Leaf)) {
            throw "aria2c was not installed at the expected Chocolatey path: $aria2"
          }
          $archiveName = "clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extract = Join-Path $env:RUNNER_TEMP "llvm-windows-x64"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang%2Bllvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          $expected = "749d22f565fcd5718dbed06512572d0e5353b502c03fe1f7f17ee8b8aca21a47"
          & $aria2 --console-log-level=notice --summary-interval=10 --continue=true --max-tries=5 --retry-wait=5 --connect-timeout=30 --timeout=120 -x 16 -s 16 -k 1M --file-allocation=none --dir "$env:RUNNER_TEMP" --out $archiveName $url
          if ($LASTEXITCODE -ne 0) { throw "Segmented LLVM download failed with exit code $LASTEXITCODE." }
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "LLVM archive SHA-256 mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar.exe -xf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw "LLVM archive extraction failed with exit code $LASTEXITCODE." }
          $llvmRoot = Join-Path $extract "clang+llvm-21.1.8-x86_64-pc-windows-msvc"
          foreach ($required in @(
            (Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"),
            (Join-Path $llvmRoot "bin\llc.exe"),
            (Join-Path $llvmRoot "bin\clang.exe")
          )) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "LLVM development archive did not provide the required file: $required"
            }
          }
          "TELL_LLVM_ROOT=$llvmRoot" >> $env:GITHUB_ENV

      - name: Build and test the native Windows compiler
        shell: pwsh
        run: ./scripts/build-tellc-windows.ps1 -LLVMRoot "$env:TELL_LLVM_ROOT" -Jobs 2

      - name: Upload Windows compiler
        uses: actions/upload-artifact@v4
        with:
          name: tellc-windows-x64
          path: |
            build/tellc-windows-x64/Release/tellc.exe
            build/tellc-windows-x64/Release/tell-lsp.exe
          if-no-files-found: error
